<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Recursive Flag of Georgia</title>
<style>
  :root {
    --ink: #f4ead7;
    --ink-dim: rgba(244, 234, 215, 0.55);
    --rule: rgba(244, 234, 215, 0.18);
    --bg: #0a0a0a;
  }
  html, body {
    margin: 0; padding: 0;
    overflow: hidden;
    background: #0a0a0a;
    color: var(--ink);
    font-family: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  canvas {
    display: block;
    position: fixed;
    top: 0;
    left: 0;
    cursor: grab;
  }
  canvas.dragging { cursor: grabbing; }

  .hud {
    position: fixed;
    pointer-events: none;
    color: var(--ink);
  }
  .hud .label {
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-dim);
    font-family: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, monospace;
  }

  #title {
    top: 22px; left: 24px; max-width: 70vw;
  }
  #title .name {
    font-size: 22px;
    font-style: italic;
    letter-spacing: 0.01em;
    line-height: 1.1;
    margin-top: 6px;
  }
  #title .name em { font-style: normal; }

  #stats {
    bottom: 22px; left: 24px;
    font-family: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, monospace;
    font-size: 11px;
    line-height: 1.6;
  }
  #stats .row { display: flex; gap: 10px; }
  #stats .k { color: var(--ink-dim); width: 7ch; }
  #stats .v { color: var(--ink); }

  #controls {
    position: fixed;
    bottom: 22px; right: 24px;
    display: flex; gap: 10px;
    pointer-events: auto;
  }
  #controls button {
    pointer-events: auto;
    background: transparent;
    border: 1px solid var(--rule);
    color: var(--ink);
    padding: 8px 14px;
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background-color 120ms ease, border-color 120ms ease;
  }
  #controls button:hover { background: rgba(244, 234, 215, 0.06); border-color: var(--ink-dim); }
  #controls button:active { background: rgba(244, 234, 215, 0.12); }

  #hints {
    top: 22px; right: 24px;
    text-align: right;
    font-family: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-dim);
    line-height: 1.7;
  }

  /* corner ornaments */
  .tick { position: fixed; width: 14px; height: 14px; border-color: var(--rule); pointer-events: none; }
  .tick.tl { top: 10px; left: 10px; border-top: 1px solid; border-left: 1px solid; }
  .tick.tr { top: 10px; right: 10px; border-top: 1px solid; border-right: 1px solid; }
  .tick.bl { bottom: 10px; left: 10px; border-bottom: 1px solid; border-left: 1px solid; }
  .tick.br { bottom: 10px; right: 10px; border-bottom: 1px solid; border-right: 1px solid; }

  @media (max-width: 600px) {
    #title .name { font-size: 18px; }
    #hints { font-size: 9px; }
    #controls button { padding: 7px 10px; font-size: 11px; }
  }
</style>
</head>
<body>

<canvas id="cv"></canvas>

<div class="tick tl"></div>
<div class="tick tr"></div>
<div class="tick bl"></div>
<div class="tick br"></div>

<div id="title" class="hud">
  <div class="label">Recursive Standard</div>
  <div class="name"><em>Georgia,</em> all the way down</div>
</div>

<div id="hints" class="hud">
  scroll · pinch — zoom<br/>
  drag — pan<br/>
  dbl-click — dive
</div>

<div id="stats" class="hud">
  <div class="row"><span class="k">depth</span><span class="v" id="depth">0</span></div>
  <div class="row"><span class="k">zoom</span><span class="v" id="zoomv">1×</span></div>
  <div class="row"><span class="k">flags</span><span class="v" id="count">0</span></div>
</div>

<div id="controls">
  <button id="reset" title="Reset view">Reset</button>
</div>

<script>
"use strict";

/* ----------------------------------------------------------
 * Recursive flag of Georgia.
 *
 * Geometry: a unit square with a centred red cross of thickness
 * 0.2. The four white corner regions are each 0.4 × 0.4 squares,
 * and each holds a recursive copy of the whole flag. The 0.4
 * scaling preserves the square aspect ratio at every level, so
 * the recursion is geometrically clean.
 *
 * Numerical strategy for "infinite" zoom:
 * The view is stored relative to a *current root flag* identified
 * by a path of corner indices from the top-level flag. When the
 * view is fully contained in one of the root's four corner
 * sub-flags, we descend: the corner becomes the new root and
 * coordinates are rescaled. When the view escapes the root, we
 * ascend. Because zoom is held in a bounded range relative to
 * the current root, float64 precision never degrades regardless
 * of how deep the user travels.
 * ---------------------------------------------------------- */

const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');

// Offscreen canvas the scene is drawn into. Normal interaction blits it
// to the visible canvas 1:1. The reset animation instead renders several
// sub-frames at intermediate zoom levels and averages them on the visible
// canvas — true sampled motion blur, so a frame that sweeps a wide zoom
// range reads as one continuous radial streak instead of a strobe of
// unrelated zoom levels.
const scene = document.createElement('canvas');
const sctx = scene.getContext('2d');

// Sampled-blur tuning: aim for one sub-frame per ~0.05 log-zoom of travel,
// capped to keep the worst-case frame cost bounded.
const BLUR_LOG_STEP = 0.05;
const BLUR_MAX_SAMPLES = 16;

// Geometry constants — official Georgia flag is 300 wide × 200 high, with
// a 40-thick central cross. The four corner crosses (40×40, centred at
// (65,40), (235,40), (65,160), (235,160) within the white quadrants) are
// each replaced by a recursive flag of the same 3:2 ratio: 60 wide × 40
// high, sharing those centres.
//
// Internally, coordinates are normalised so flag height = 1, width = 1.5.
// Sub-flags are 0.3 × 0.2 (scale factor 0.2 in both dimensions, preserving
// the 3:2 aspect — the recursion is self-similar).
const FLAG_W = 1.5;
const FLAG_H = 1.0;
const CROSS  = 0.2;                  // 40/200, both x- and y-thickness
const SUB    = 0.2;                  // sub-flag scale (60/300 = 40/200)
const SUB_W  = SUB * FLAG_W;         // 0.3
const SUB_H  = SUB * FLAG_H;         // 0.2
const CORNERS = [                    // sub-flag top-left, in parent coords
  [ 35/200,  20/200],   // TL = (0.175, 0.1)
  [205/200,  20/200],   // TR = (1.025, 0.1)
  [ 35/200, 140/200],   // BL = (0.175, 0.7)
  [205/200, 140/200],   // BR = (1.025, 0.7)
];

// Colors (Georgian flag red is close to Pantone 032)
const RED = '#e8112d';
const WHITE = '#ffffff';
const BG = '#0a0a0a';

// View state — coordinates are within the *current root flag*.
let viewX = FLAG_W / 2, viewY = FLAG_H / 2; // centre of root flag
let zoom = 1;                        // pixels per root-height-unit
let path = [];                       // list of corner indices: depth = path.length

// Set initial zoom so the root flag fits with breathing room
function fitZoom() {
  const m = 0.85;
  return Math.min(canvas.width * m / FLAG_W, canvas.height * m / FLAG_H);
}
function fitFlag() {
  zoom = fitZoom();
}

// Zoom limits, relative to the current root. The min stops the flag
// shrinking to an unfindable dot. The max stops float64 falling apart:
// rebasing keeps zoom bounded whenever the user dives toward real detail
// (each descent divides zoom by 5), so zoom only grows without bound when
// aimed at featureless regions — the cross interior, plain white, or the
// invisible white-on-white edge of a sub-flag — where there is nothing
// more to see anyway. 1e9 keeps drift at ~1e-4 px per event.
const MIN_ZOOM_REL = 0.1;
const MAX_ZOOM_REL = 1e9;

function clampZoom(z) {
  const fit = fitZoom();
  return Math.min(Math.max(z, fit * MIN_ZOOM_REL), fit * MAX_ZOOM_REL);
}

let frameFlagCount = 0;

/* -------------------- Rendering -------------------- */

// fillRect clipped to the viewport. Canvas rasterisers misbehave when fed
// astronomically large coordinates, and near max zoom the root flag's
// screen rect is ~1e12 px wide; clipping axis-aligned rects is exact.
function fillClamped(x, y, w, h) {
  const x0 = Math.max(x, -2), y0 = Math.max(y, -2);
  const x1 = Math.min(x + w, canvas.width + 2);
  const y1 = Math.min(y + h, canvas.height + 2);
  if (x1 <= x0 || y1 <= y0) return;
  sctx.fillRect(x0, y0, x1 - x0, y1 - y0);
}

function flagToScreen(fx, fy) {
  return [
    (fx - viewX) * zoom + canvas.width / 2,
    (fy - viewY) * zoom + canvas.height / 2,
  ];
}

function renderFlag(fx, fy, fs) {
  // fs is the flag's height in flag-coords; width is 1.5×fs.
  const screenW = FLAG_W * fs * zoom;
  const screenH = FLAG_H * fs * zoom;
  const sx = (fx - viewX) * zoom + canvas.width / 2;
  const sy = (fy - viewY) * zoom + canvas.height / 2;

  // Cull: outside viewport
  if (sx + screenW < 0 || sx > canvas.width)  return;
  if (sy + screenH < 0 || sy > canvas.height) return;

  // Too small to bother subdividing — paint a colour-averaged blob
  // (the flag is ~36.5% red overall, counting the recursion)
  if (screenH < 2.2) {
    sctx.fillStyle = '#f7a9b3';
    fillClamped(sx, sy, screenW + 1, screenH + 1);
    frameFlagCount++;
    return;
  }

  // White field
  sctx.fillStyle = WHITE;
  fillClamped(sx, sy, screenW, screenH);

  // Red cross — vertical bar (40 thick, full height) then horizontal bar
  // (full width, 40 thick). Both bars are CROSS×fs×zoom = 0.2×fs×zoom thick.
  const T = CROSS * fs * zoom;
  sctx.fillStyle = RED;
  fillClamped(sx + (screenW - T) / 2, sy, T, screenH);
  fillClamped(sx, sy + (screenH - T) / 2, screenW, T);

  frameFlagCount++;

  // Recurse into the four corner sub-flags
  const subFs = fs * SUB;
  for (let c = 0; c < 4; c++) {
    const [ox, oy] = CORNERS[c];
    renderFlag(fx + ox * fs, fy + oy * fs, subFs);
  }
}


function drawScene() {
  frameFlagCount = 0;
  sctx.fillStyle = BG;
  sctx.fillRect(0, 0, canvas.width, canvas.height);
  renderFlag(0, 0, 1);
}

function updateHud() {
  document.getElementById('depth').textContent = String(path.length);
  document.getElementById('count').textContent = String(frameFlagCount);
  // Effective zoom relative to fully-fitted root
  const effective = (zoom / fitZoom()) * Math.pow(1 / SUB, path.length);
  document.getElementById('zoomv').textContent = formatZoom(effective);
}

function render() {
  drawScene();
  ctx.globalAlpha = 1;
  ctx.drawImage(scene, 0, 0);
  updateHud();
}

function formatZoom(z) {
  if (z < 1000) return z.toFixed(2) + '×';
  // Scientific-ish for big numbers
  const exp = Math.floor(Math.log10(z));
  const mant = (z / Math.pow(10, exp)).toFixed(2);
  return mant + '×10^' + exp;
}

/* -------------------- Rebasing -------------------- */
/* Keep coordinates well-conditioned by descending into a corner
 * sub-flag whenever the view fits entirely inside one, and
 * ascending when it spills out of the current root. The
 * transformation is exact except for one float multiplication
 * per step, so precision stays bounded at any depth.            */

function viewBounds() {
  const halfW = (canvas.width  / 2) / zoom;
  const halfH = (canvas.height / 2) / zoom;
  return [viewX - halfW, viewY - halfH, viewX + halfW, viewY + halfH];
}

function maybeDescend() {
  // Iteration cap guards against a runaway loop; it is generous enough
  // that a single event never legitimately needs more steps.
  for (let i = 0; i < 64; i++) {
    const [minX, minY, maxX, maxY] = viewBounds();
    let chosen = -1;
    for (let c = 0; c < 4; c++) {
      const [ox, oy] = CORNERS[c];
      if (minX >= ox && maxX <= ox + SUB_W &&
          minY >= oy && maxY <= oy + SUB_H) {
        chosen = c; break;
      }
    }
    if (chosen === -1) return;
    const [ox, oy] = CORNERS[chosen];
    viewX = (viewX - ox) / SUB;
    viewY = (viewY - oy) / SUB;
    zoom *= SUB;
    path.push(chosen);
    // The dive target path is relative to the root: descending consumes
    // its first corner (which must match — the view is inside the target
    // chain whenever a dive is running).
    if (divePath) {
      if (divePath.length > 0 && divePath[0] === chosen) divePath.shift();
      else cancelDive();
    }
  }
}

function maybeAscend() {
  for (let i = 0; i < 64; i++) {
    if (path.length === 0) return;
    const [minX, minY, maxX, maxY] = viewBounds();
    const escapes =
      minX < 0 || maxX > FLAG_W || minY < 0 || maxY > FLAG_H;
    if (!escapes) return;
    const c = path.pop();
    const [ox, oy] = CORNERS[c];
    viewX = ox + viewX * SUB;
    viewY = oy + viewY * SUB;
    zoom /= SUB;
    if (divePath) divePath.unshift(c);
  }
}

function rebase() { maybeAscend(); maybeDescend(); }

/* -------------------- Resize -------------------- */

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = window.innerWidth, h = window.innerHeight;
  canvas.width = Math.floor(w * dpr);
  canvas.height = Math.floor(h * dpr);
  scene.width = canvas.width;
  scene.height = canvas.height;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.setTransform(1, 0, 0, 1, 0, 0); // raw pixel space
}


let resetRaf = null;
let resetActive = false;

function cancelResetAnimation() {
  if (resetRaf !== null) {
    cancelAnimationFrame(resetRaf);
    resetRaf = null;
  }
  resetActive = false;
}

let diveRaf = null;
let diveActive = false;

function cancelDive() {
  if (diveRaf !== null) {
    cancelAnimationFrame(diveRaf);
    diveRaf = null;
  }
  diveActive = false;
  divePath = null;
}

// Any user input cancels whichever animation is running.
function cancelAnimations() {
  cancelResetAnimation();
  cancelDive();
}

/* Double-click starts a sustained dive. Zooming blindly at the clicked
 * pixel almost always bottoms out in featureless red or white, so the
 * dive picks an interesting destination instead: the nearest visible
 * cross to the click, extended by a random corner path deep past the
 * edge of visibility. The path is always kept DIVE_LOOKAHEAD (several
 * levels) deeper than the viewport scale, so each lazy extension moves the
 * anchor by well under a pixel: the result is one smooth, straight
 * zoom along a fixed limit point of the recursion, threading through
 * cross after cross indefinitely. Any input cancels it.
 *
 * The target is stored as a PATH of corner indices below the current
 * root, not as coordinates: rebasing coordinates would multiply their
 * float error by 5 at every descent (visibly wrong after ~22 levels),
 * whereas shifting an exact integer path is lossless at any depth.
 * The target flag's coordinates are recomputed fresh each frame from
 * the path, so error never accumulates. */

let divePath = null; // corner indices from current root to target flag

function diveTargetFlag() {
  let x = 0, y = 0, fs = 1;
  for (const c of divePath) {
    x += CORNERS[c][0] * fs;
    y += CORNERS[c][1] * fs;
    fs *= SUB;
  }
  return { x, y, fs };
}

const DIVE_MIN_VISIBLE = 24; // px — smallest flag that counts as "visible"

// Keep the target flag this many levels below viewport scale. Extending
// the random path then perturbs the anchor point by at most
// SUB^LOOKAHEAD × viewport ≈ 0.01 px — invisible, so the dive stays a
// single straight zoom even though the path is chosen lazily.
const DIVE_LOOKAHEAD = Math.pow(SUB, 7);

function extendDiveTarget() {
  let fs = Math.pow(SUB, divePath.length);
  while (fs * zoom > canvas.height * DIVE_LOOKAHEAD) {
    divePath.push(Math.floor(Math.random() * 4));
    fs *= SUB;
  }
}

function pickDiveTarget(fx, fy) {
  // Walk down the chain of flags containing the click, as long as the
  // containing sub-flag is still comfortably visible on screen,
  // collecting the corner path as we go.
  const p = [];
  let x = 0, y = 0, fs = 1;
  for (let guard = 0; guard < 64; guard++) {
    let entered = false;
    for (let c = 0; c < 4; c++) {
      const sx = x + CORNERS[c][0] * fs, sy = y + CORNERS[c][1] * fs;
      const sfs = fs * SUB;
      if (sfs * zoom < DIVE_MIN_VISIBLE) continue;
      if (fx >= sx && fx <= sx + FLAG_W * sfs &&
          fy >= sy && fy <= sy + FLAG_H * sfs) {
        x = sx; y = sy; fs = sfs;
        p.push(c);
        entered = true;
        break;
      }
    }
    if (!entered) break;
  }
  // Nearest cross to the click: this flag's own, or one of its four
  // sub-flags' (a cross is centred in its flag).
  let bestC = -1;
  let best = Math.hypot(fx - (x + FLAG_W / 2 * fs),
                        fy - (y + FLAG_H / 2 * fs));
  for (let c = 0; c < 4; c++) {
    const sx = x + CORNERS[c][0] * fs, sy = y + CORNERS[c][1] * fs;
    const sfs = fs * SUB;
    const d = Math.hypot(fx - (sx + FLAG_W / 2 * sfs),
                         fy - (sy + FLAG_H / 2 * sfs));
    if (d < best) { best = d; bestC = c; }
  }
  if (bestC >= 0) p.push(bestC);
  divePath = p;
  // Commit to a random corner path far past the edge of visibility.
  extendDiveTarget();
}

function startDive(clientX, clientY) {
  cancelAnimations();
  const dpr = canvas.width / canvas.clientWidth;
  const fx = (clientX * dpr - canvas.width / 2) / zoom + viewX;
  const fy = (clientY * dpr - canvas.height / 2) / zoom + viewY;
  pickDiveTarget(fx, fy);
  diveActive = true;

  const cruiseRate = 2.4 / 1000; // log-zoom per ms (~1.5 depth levels/s)
  const rampMs = 600;
  const panTau = 320;            // ms — target's ease toward screen centre
  let start = null;
  let last = null;

  function tick(now) {
    if (!diveActive) return;
    if (start === null) { start = now; last = now; }
    const dt = Math.min(now - last, 100);
    last = now;
    const rate = cruiseRate * smoothstep(Math.min(1, (now - start) / rampMs));

    // Lazily extend the committed path, staying far below view scale.
    extendDiveTarget();

    const tf = diveTargetFlag();
    const tx = tf.x + (FLAG_W / 2) * tf.fs;
    const ty = tf.y + (FLAG_H / 2) * tf.fs;
    // The target's screen position eases toward the centre while the
    // zoom advances anchored on the target, so the dive both closes in
    // on the cross and re-centres it.
    const sx0 = (tx - viewX) * zoom + canvas.width / 2;
    const sy0 = (ty - viewY) * zoom + canvas.height / 2;
    const blend = 1 - Math.exp(-dt / panTau);
    const sx = sx0 + (canvas.width / 2 - sx0) * blend;
    const sy = sy0 + (canvas.height / 2 - sy0) * blend;
    zoom = clampZoom(zoom * Math.exp(rate * dt));
    viewX = tx - (sx - canvas.width / 2) / zoom;
    viewY = ty - (sy - canvas.height / 2) / zoom;
    rebase();
    scheduleRender();
    diveRaf = requestAnimationFrame(tick);
  }

  diveRaf = requestAnimationFrame(tick);
}

function smoothstep(t) {
  return t * t * (3 - 2 * t);
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}

function reset() {
  cancelAnimations();
  resetActive = true;

  const cx = canvas.clientWidth / 2;
  const cy = canvas.clientHeight / 2;
  let phase = 'ascend';
  let lastNow = null;
  let settleStart = 0;
  let settleFromX = 0;
  let settleFromY = 0;
  let settleFromZoom = 0;
  const settleDuration = 850;

  // The ascent starts at a stately pace and accelerates exponentially,
  // doubling roughly every 1.8 s. Total return time therefore grows with
  // the log of the distance travelled: shallow dives amble home, deep ones
  // keep gathering speed — a felt sense of how far down you were. Tuned so
  // a 100-level dive returns in ~10 s. Rebasing still happens step by step
  // through the ordinary zoomAt/rebase machinery, so coordinates stay
  // well-conditioned.
  const baseRate = -Math.log(0.978) / 16.7; // log-zoom per ms, initial
  const rateTau = 2600;                     // ms for the rate to grow by e
  let ascendStart = null;

  function startSettle(now) {
    phase = 'settle';
    settleStart = now;
    settleFromX = viewX;
    settleFromY = viewY;
    settleFromZoom = zoom;
  }

  function tick(now) {
    if (!resetActive) return;

    if (phase === 'ascend') {
      if (path.length > 0) {
        if (ascendStart === null) ascendStart = now;
        const dt = lastNow === null ? 16.7 : Math.min(now - lastNow, 100);
        lastNow = now;
        const rate = baseRate * Math.exp((now - ascendStart) / rateTau);

        // Sampled motion blur: this frame sweeps `logStep` of log-zoom.
        // Split the sweep into sub-frames spaced ≤ BLUR_LOG_STEP apart,
        // render each at its intermediate zoom, and average them on the
        // visible canvas (drawing sample i at alpha 1/(i+1) yields a
        // uniform mean). At low speed this degenerates to one sharp
        // frame; at high speed the averaged samples form continuous
        // radial streaks instead of a strobe of unrelated zoom levels.
        const logStep = rate * dt;
        const n = Math.min(BLUR_MAX_SAMPLES,
                           Math.max(1, Math.ceil(logStep / BLUR_LOG_STEP)));
        const subFactor = Math.exp(-logStep / n);
        for (let i = 0; i < n && path.length > 0; i++) {
          applyZoom(cx, cy, subFactor);
          drawScene();
          ctx.globalAlpha = 1 / (i + 1);
          ctx.drawImage(scene, 0, 0);
        }
        ctx.globalAlpha = 1;
        updateHud();

        resetRaf = requestAnimationFrame(tick);
        return;
      }
      startSettle(now);
    }

    const t = Math.min(1, (now - settleStart) / settleDuration);
    const e = smoothstep(t);
    viewX = lerp(settleFromX, FLAG_W / 2, e);
    viewY = lerp(settleFromY, FLAG_H / 2, e);
    zoom = lerp(settleFromZoom, fitZoom(), e);
    rebase();
    scheduleRender();

    if (t < 1) {
      resetRaf = requestAnimationFrame(tick);
    } else {
      resetRaf = null;
      resetActive = false;
      path = [];
      viewX = FLAG_W / 2;
      viewY = FLAG_H / 2;
      zoom = fitZoom();
      scheduleRender();
    }
  }

  resetRaf = requestAnimationFrame(tick);
}

window.addEventListener('resize', () => {
  // Preserve the current effective view across resize
  resize();
  rebase();
  scheduleRender();
});

/* -------------------- Input: mouse/wheel -------------------- */

let dragging = false, lastPx = 0, lastPy = 0;

canvas.addEventListener('mousedown', (e) => {
  cancelAnimations();
  dragging = true;
  lastPx = e.clientX; lastPy = e.clientY;
  canvas.classList.add('dragging');
});
window.addEventListener('mouseup', () => {
  dragging = false;
  canvas.classList.remove('dragging');
});
window.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  cancelAnimations();
  const dpr = canvas.width / canvas.clientWidth;
  const dx = (e.clientX - lastPx) * dpr;
  const dy = (e.clientY - lastPy) * dpr;
  lastPx = e.clientX; lastPy = e.clientY;
  viewX -= dx / zoom;
  viewY -= dy / zoom;
  rebase();
  scheduleRender();
});

canvas.addEventListener('wheel', (e) => {
  cancelAnimations();
  e.preventDefault();
  // Normalise deltaMode: Firefox reports lines (mode 1), not pixels
  let dy = e.deltaY;
  if (e.deltaMode === 1) dy *= 33;
  else if (e.deltaMode === 2) dy *= window.innerHeight;
  zoomAt(e.clientX, e.clientY, Math.exp(-dy * 0.0015));
}, { passive: false });

canvas.addEventListener('dblclick', (e) => {
  startDive(e.clientX, e.clientY);
});

// Apply a zoom step about a client-space point, without scheduling a
// render — the reset animation calls this several times per frame while
// building its motion-blurred composite.
function applyZoom(clientX, clientY, factor) {
  const newZoom = clampZoom(zoom * factor);
  if (newZoom === zoom) return;
  const dpr = canvas.width / canvas.clientWidth;
  const px = clientX * dpr, py = clientY * dpr;
  // Flag-coord under cursor before zoom
  const fx = (px - canvas.width / 2)  / zoom + viewX;
  const fy = (py - canvas.height / 2) / zoom + viewY;
  zoom = newZoom;
  // Reposition view so (fx, fy) stays under the cursor
  viewX = fx - (px - canvas.width / 2)  / zoom;
  viewY = fy - (py - canvas.height / 2) / zoom;
  rebase();
}

function zoomAt(clientX, clientY, factor) {
  applyZoom(clientX, clientY, factor);
  scheduleRender();
}

/* -------------------- Input: touch (pan + pinch) -------------------- */

/* Both pan and pinch are applied incrementally, event by event, rather
 * than from a gesture-start snapshot. Snapshots break here: rebase() can
 * change the root flag mid-gesture, and a snapshot taken in the old
 * root's coordinates then teleports the view. Increments always operate
 * on the current root, so they compose with rebasing for free. */

let touches = new Map();   // identifier -> {x, y}
let lastSingleTouch = null; // {x, y} of the panning finger, prev event
let lastPinch = null;       // { dist, midX, midY } from the prev event

function pinchGeometry() {
  const arr = [...touches.values()];
  const dx = arr[0].x - arr[1].x;
  const dy = arr[0].y - arr[1].y;
  return {
    dist: Math.hypot(dx, dy),
    midX: (arr[0].x + arr[1].x) / 2,
    midY: (arr[0].y + arr[1].y) / 2,
  };
}

canvas.addEventListener('touchstart', (e) => {
  cancelAnimations();
  for (const t of e.changedTouches) {
    touches.set(t.identifier, { x: t.clientX, y: t.clientY });
  }
  if (touches.size === 2) {
    lastPinch = pinchGeometry();
    lastSingleTouch = null;
  } else if (touches.size === 1) {
    lastPinch = null;
    const t = [...touches.values()][0];
    lastSingleTouch = { x: t.x, y: t.y };
  } else {
    lastPinch = null;
    lastSingleTouch = null;
  }
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (touches.has(t.identifier)) {
      touches.set(t.identifier, { x: t.clientX, y: t.clientY });
    }
  }
  if (touches.size === 1 && lastSingleTouch) {
    // Single-finger pan
    const t = [...touches.values()][0];
    const dpr = canvas.width / canvas.clientWidth;
    viewX -= (t.x - lastSingleTouch.x) * dpr / zoom;
    viewY -= (t.y - lastSingleTouch.y) * dpr / zoom;
    lastSingleTouch = { x: t.x, y: t.y };
    rebase();
    scheduleRender();
  } else if (touches.size === 2 && lastPinch) {
    const p = pinchGeometry();
    // Zoom by the change in finger spread, anchored at the midpoint...
    if (lastPinch.dist > 0 && p.dist > 0) {
      zoomAt(p.midX, p.midY, p.dist / lastPinch.dist);
    }
    // ...then pan by the midpoint's motion
    const dpr = canvas.width / canvas.clientWidth;
    viewX -= (p.midX - lastPinch.midX) * dpr / zoom;
    viewY -= (p.midY - lastPinch.midY) * dpr / zoom;
    lastPinch = p;
    rebase();
    scheduleRender();
  }
}, { passive: false });

function touchesEnded(e) {
  for (const t of e.changedTouches) touches.delete(t.identifier);
  lastPinch = touches.size === 2 ? pinchGeometry() : null;
  if (touches.size === 1) {
    const t = [...touches.values()][0];
    lastSingleTouch = { x: t.x, y: t.y };
  } else {
    lastSingleTouch = null;
  }
}
canvas.addEventListener('touchend', touchesEnded, { passive: false });
canvas.addEventListener('touchcancel', touchesEnded, { passive: false });

/* -------------------- Input: keyboard -------------------- */

window.addEventListener('keydown', (e) => {
  const dpr = canvas.width / canvas.clientWidth;
  const step = 40 * dpr;
  if (e.key === 'r' || e.key === 'R') {
    reset();
    e.preventDefault();
    return;
  }
  if (e.key === '+' || e.key === '=' || e.key === '-' || e.key === '_') {
    cancelAnimations();
    const f = (e.key === '+' || e.key === '=') ? 1.4 : 1 / 1.4;
    zoomAt(canvas.clientWidth / 2, canvas.clientHeight / 2, f);
    e.preventDefault();
    return;
  }
  let handled = true;
  if (e.key === 'ArrowLeft')       viewX -= step / zoom;
  else if (e.key === 'ArrowRight') viewX += step / zoom;
  else if (e.key === 'ArrowUp')    viewY -= step / zoom;
  else if (e.key === 'ArrowDown')  viewY += step / zoom;
  else handled = false;
  if (handled) {
    cancelAnimations();
    rebase();
    scheduleRender();
    e.preventDefault();
  }
});

document.getElementById('reset').addEventListener('click', reset);

/* -------------------- Render loop -------------------- */

let rafScheduled = false;
function scheduleRender() {
  if (rafScheduled) return;
  rafScheduled = true;
  requestAnimationFrame(() => { rafScheduled = false; render(); });
}

/* -------------------- Boot -------------------- */

resize();
fitFlag();
render();

</script>
</body>
